<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c13;--panel:#17131e;--panel2:#211a2a;--line:#33283e;--text:#f7f1fb;--muted:#a99ab5;--purple:#c878e8;--purple2:#9b4fc0;--green:#52d6a0;--red:#ff7186;--yellow:#f5c76c;--radius:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,'Hind Siliguri',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;transition:.2s}button:hover{filter:brightness(1.12);transform:translateY(-1px)}.app{min-height:100vh;display:grid;grid-template-columns:244px 1fr}.sidebar{background:#121019;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:7px 9px 18px;font-weight:800;font-size:17px}.brandmark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--purple),#7643a4);color:#170d20}.quick{width:100%;padding:10px 12px;background:#1b1722;border:1px solid var(--line);border-radius:10px;color:var(--muted);text-align:left;margin-bottom:15px}.navlabel{font-size:10px;color:#766b82;letter-spacing:1.3px;margin:18px 10px 7px}.navbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;color:#c7bbd1;background:transparent;padding:10px;border-radius:9px;text-align:left;margin:2px 0}.navbtn .ico{width:18px;text-align:center}.navbtn.active,.navbtn:hover{background:#30203a;color:#e5a6ff}.subnav{padding-left:20px}.subnav .navbtn{font-size:12px;padding:8px 10px}.main{min-width:0}.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 22px;position:sticky;top:0;background:#100e16ed;backdrop-filter:blur(14px);z-index:5}.toplink{border:0;background:transparent;color:#c6b8d0;padding:9px 11px;border-radius:8px;font-size:12px}.toplink.active{background:#30203a;color:#e7a8ff}.topright{margin-left:auto;display:flex;gap:8px;align-items:center}.avatar{width:30px;height:30px;border-radius:50%;background:#d28bea;color:#21132a;display:grid;place-items:center;font-weight:800}.content{padding:22px;max-width:1800px;margin:auto}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.pagehead h1{font-size:23px;margin:0 0 5px}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:1px solid var(--line);background:#211a2a;color:var(--text);padding:10px 13px;border-radius:9px}.btn.primary{background:linear-gradient(135deg,#ce84e8,#a454c6);color:#1b0e22;border:0;font-weight:800}.btn.danger{color:#ff9eaa}.btn.success{color:#7be4b7}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px;min-width:0}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.stat{background:linear-gradient(145deg,#1b1623,#15121b);border:1px solid var(--line);border-radius:14px;padding:18px}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:27px;font-weight:800;margin:10px 0 5px}.stat .hint{font-size:11px;color:#8b7c98}.two{grid-template-columns:1.3fr 1fr}.sectiontitle{font-size:15px;font-weight:700;margin:0 0 15px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:11px;color:#b8a9c5}.field input,.field select,.field textarea,.searchbox{width:100%;background:#100e16;border:1px solid #3a2d46;color:var(--text);border-radius:8px;padding:10px 11px;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.searchbox:focus{border-color:var(--purple);box-shadow:0 0 0 3px #c878e822}.field textarea{min-height:76px;resize:vertical}.searchbox{max-width:300px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th{background:#241b2d;color:#d8b5e9;text-align:left;font-weight:600;padding:12px 10px}td{padding:12px 10px;border-top:1px solid #2b2234;color:#e4dce9}tbody tr:hover{background:#201827}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:20px;font-size:10px;background:#30203a;color:#e6aaff}.pill.green{background:#16372c;color:#8cebc0}.pill.yellow{background:#3b3019;color:#f6d889}.pill.red{background:#421f2a;color:#ff9eae}.statusbar{display:flex;gap:5px;overflow:auto;padding-bottom:12px;margin-bottom:10px}.statusbtn{flex:0 0 auto;border:1px solid var(--line);border-radius:9px;background:#191520;color:#c8b8d2;padding:9px 12px;font-size:11px}.statusbtn.active{background:#3a2344;border-color:#a95bc7;color:#f1caff}.statusbtn b{margin-left:7px}.hidden{display:none!important}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.span2{grid-column:span 2}.span3{grid-column:1/-1}.productlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product{display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:9px;border-radius:10px;background:#14111a}.product .thumb{width:50px;height:54px;border-radius:8px;background:linear-gradient(135deg,#5b315f,#c17bd2);display:grid;place-items:center;font-size:20px;flex-shrink:0}.product h4{margin:0 0 5px;font-size:12px}.product p{margin:0;color:var(--muted);font-size:11px}.product .btn{padding:6px 9px;margin-left:auto}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:#1b1622;color:#cbbbd6;border-radius:8px;padding:8px 11px}.tab.active{background:#3a2344;color:#f2c9ff}.modalback{position:fixed;inset:0;background:#07050bc9;z-index:20;display:grid;place-items:center;padding:18px;backdrop-filter:blur(5px)}.modal{width:min(850px,100%);max-height:92vh;overflow:auto;background:#17131e;border:1px solid #4b3559;border-radius:16px;padding:22px;box-shadow:0 25px 100px #0009;animation:pop .22s ease}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}.close{border:0;background:#2a2032;color:#fff;border-radius:8px;width:34px;height:34px}.toast{position:fixed;right:20px;bottom:20px;background:#241c2e;border:1px solid #68457c;padding:13px 17px;border-radius:10px;z-index:50;box-shadow:0 12px 35px #0008;animation:slide .25s ease}.storehead{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:58px;background:#100e16ed;z-index:4}.storehero{padding:40px 26px;border-radius:18px;background:radial-gradient(circle at 80% 20%,#6b347f 0,transparent 38%),linear-gradient(120deg,#291632,#15111d);margin-bottom:20px}.storehero h2{font-size:clamp(26px,4vw,42px);margin:0 0 8px}.storegrid{grid-template-columns:repeat(4,minmax(0,1fr))}.storeproduct{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#17131e}.storeimage{height:150px;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,#37203f,#775081)}.storeproduct .body{padding:13px}.storeproduct h3{font-size:13px;margin:0 0 7px}.price{font-weight:800;color:#e5a4ff;margin-bottom:10px}.empty{text-align:center;padding:38px;color:var(--muted)}.check{width:15px;height:15px;accent-color:var(--purple)}.footer{padding:20px;color:#73677e;text-align:center;font-size:11px}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:1000px){.app{grid-template-columns:210px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.storegrid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.app{display:block}.sidebar{height:auto;position:relative;padding:10px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding-bottom:8px}.quick,.navlabel,.subnav{display:none}.sidebar nav{display:flex;gap:5px;overflow:auto}.navbtn{width:auto;white-space:nowrap;flex-shrink:0;font-size:12px}.topbar{padding:0 9px;overflow:auto}.toplink{white-space:nowrap;padding:8px}.topright{display:none}.content{padding:13px}.pagehead{align-items:flex-start;flex-direction:column}.stats{gap:8px}.stat{padding:13px}.stat .value{font-size:22px}.two{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.span2,.span3{grid-column:auto}.productlist{grid-template-columns:1fr}.storegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.storeimage{height:115px}.storehead{top:48px;padding:12px}.storehero{padding:25px 18px}}
</style></head><body><div id="app"></div><div id="overlay"></div><div id="toastbox"></div>
<script>
const KEY='alvina_allinone_v1';
const defaults={products:[{id:1,name:'Elegant Cotton Kurti',price:1250,oldPrice:1590,size:'36,38,40,42,44',stock:12,active:true,category:'Women Wear'},{id:2,name:'Premium Printed Three Piece',price:1850,oldPrice:2200,size:'38,40,42,44',stock:8,active:true,category:'Three Piece'},{id:3,name:'Classic Embroidered Dress',price:1490,oldPrice:1790,size:'36,38,40,42',stock:5,active:true,category:'Dress'},{id:4,name:'Everyday Cotton Top',price:690,oldPrice:850,size:'S,M,L,XL',stock:20,active:true,category:'Top'}],orders:[{id:'AV-1001',date:new Date().toISOString(),customer:'Nusrat Jahan',phone:'01700000000',address:'Dhanmondi, Dhaka',product:'Elegant Cotton Kurti',qty:1,subtotal:1250,delivery:80,total:1330,status:'Pending',source:'Website',size:'40',note:''},{id:'AV-1002',date:new Date(Date.now()-86400000).toISOString(),customer:'Sadia Islam',phone:'01800000000',address:'Cumilla Sadar',product:'Premium Printed Three Piece',qty:1,subtotal:1850,delivery:150,total:2000,status:'Confirmed',source:'Manual',size:'42',note:'Call before delivery'}],settings:{brand:'ALVINA',phone:'01956591199',inside:80,outside:150,announcement:'New collection is here — discover your style',primary:'#c878e8'}};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){db=JSON.parse(JSON.stringify(defaults))}let page='Dashboard',statusFilter='All',query='',editingProduct=null,storeMode=false;
const navGroups=[{label:'',items:[['Dashboard','▦']]},{label:'OPERATIONS',items:[['Search','⌕'],['Web Orders','▣', ['New Order','Web Order List','Auto Call Center']],['Approved Orders','☑',['Order List','Scan To Update']] ]},{label:'INVENTORY',items:[['Inventory','▤',['Inventory Dashboard','Products','Add Product','Stock Ledger','Low Stock Alert']]]},{label:'WORKFLOW',items:[['Task & Follow-up','☷',['Task Board','Agent Cockpit','My Follow-ups']],['Work Inbox','▤',['My Work']]]},{label:'SYSTEM',items:[['Support','◉',['Help Center']],['Settings','⚙',['Website Settings','Payment Settings','Delivery Settings','User Access','Login History']]]}];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function money(n){return '৳'+Number(n||0).toLocaleString('en-BD')}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){document.getElementById('toastbox').innerHTML=`<div class="toast">✓ &nbsp;${esc(s)}</div>`;setTimeout(()=>document.getElementById('toastbox').innerHTML='',2600)}function setPage(p){page=p;storeMode=p==='View Page';render()}function navItem(item){if(item==='New Order'){openOrder();return}if(item==='Add Product'){openProduct();return}setPage(item)}
function render(){if(storeMode){renderStore();return}document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><span class="brandmark">A</span> ${esc(db.settings.brand)} <span class="muted small">⌄</span></div><button class="quick" onclick="setPage('Search')">⌕ &nbsp; Quick Search <span style="float:right">CTRL K</span></button><nav>${navGroups.map(g=>`${g.label?`<div class="navlabel">${g.label}</div>`:''}${g.items.map(it=>`<button class="navbtn ${page===it[0]||(it[2]||[]).includes(page)?'active':''}" onclick="${it[2]?`toggleGroup('${it[0]}')`:`navItem('${it[0]}')`}"><span class="ico">${it[1]}</span>${it[0]}${it[2]?'<span style="margin-left:auto">⌄</span>':''}</button>${it[2]?`<div class="subnav ${expanded.has(it[0])?'':'hidden'}">${it[2].map(sub=>`<button class="navbtn ${page===sub?'active':''}" onclick="event.stopPropagation();navItem('${sub}')">${sub}</button>`).join('')}</div>`:''}`).join('')}`).join('')}</nav><div class="footer">ALVINA Admin · Demo</div></aside><main class="main"><header class="topbar"><button class="toplink" onclick="setPage('Search')">⌕ Search</button><button class="toplink" onclick="openOrder()">🛒 New Order</button><button class="toplink" onclick="setPage('Web Order List')">◎ Web Order List</button><button class="toplink ${page==='Order List'?'active':''}" onclick="setPage('Order List')">☷ Order List</button><button class="toplink" onclick="setPage('Send Message')">▱ Send Message</button><div class="topright"><button class="toplink" onclick="toast('Language selector: Bangla / English')">文 BN</button><button class="toplink" onclick="toast('Notifications opened')">♧</button><button class="toplink" onclick="toast('No new notifications')">♧</button><button class="toplink" onclick="document.body.classList.toggle('lightmode');toast('Theme toggled')">☾</button><span class="avatar">A</span></div></header><section class="content">${pageContent()}</section></main></div>`}
const expanded=new Set(['Web Orders','Approved Orders','Inventory','Task & Follow-up','Support']);function toggleGroup(g){expanded.has(g)?expanded.delete(g):expanded.add(g);render()}
function pageContent(){if(['Order List','Web Order List','Approved Orders','Search'].includes(page))return ordersPage();if(page==='New Order')return `<div class="pagehead"><div><h1>New Order</h1><div class="muted">Create a customer order</div></div><button class="btn primary" onclick="openOrder()">＋ Create Order</button></div>`;if(['Products','Inventory Dashboard','Stock Ledger','Low Stock Alert','Add Product'].includes(page))return inventoryPage();if(page==='Dashboard')return dashboard();if(page==='Settings'||page.includes('Settings')||page==='User Access'||page==='Login History')return settingsPage();if(page==='View Page')return renderStore();if(page==='Task Board'||page==='Agent Cockpit'||page==='My Follow-ups'||page==='My Work'||page==='Work Inbox')return simplePage('Task & Follow-up','Create and manage internal tasks.',[['＋ New Task',()=>openTask()],['Export CSV',exportTasks]]);if(page==='Auto Call Center'||page==='Send Message'||page==='Help Center'||page==='Support')return simplePage(page,'This module is a working demo area.',[['＋ Add New',()=>toast('Module action opened')],['Refresh',()=>toast('Refreshed')]]);return simplePage(page,'Search and manage your Alvina workspace.',[['＋ New Order',openOrder],['View Website',()=>setPage('View Page')]])}
function dashboard(){let revenue=db.orders.filter(o=>o.status==='Delivered').reduce((s,o)=>s+o.total,0);return `<div class="pagehead"><div><h1>Dashboard</h1><div class="muted">Welcome back to ${esc(db.settings.brand)} · Store overview</div></div><div class="btnrow"><button class="btn" onclick="setPage('View Page')">↗ View Page</button><button class="btn primary" onclick="openOrder()">＋ New Order</button></div></div><div class="grid stats"><div class="stat"><div class="label">Total Orders</div><div class="value">${db.orders.length}</div><div class="hint">All order records</div></div><div class="stat"><div class="label">Pending Orders</div><div class="value">${db.orders.filter(o=>o.status==='Pending').length}</div><div class="hint">Need attention</div></div><div class="stat"><div class="label">Products</div><div class="value">${db.products.length}</div><div class="hint">${db.products.filter(p=>p.stock<=5).length} low stock items</div></div><div class="stat"><div class="label">Delivered Revenue</div><div class="value">${money(revenue)}</div><div class="hint">Delivered orders only</div></div></div><div class="grid two"><div class="card"><div class="pagehead"><h3 class="sectiontitle">Recent Orders</h3><button class="btn" onclick="setPage('Order List')">View all →</button></div>${ordersTable(db.orders.slice(0,6),false)}</div><div class="card"><h3 class="sectiontitle">Quick Actions</h3><div class="grid" style="grid-template-columns:1fr 1fr"><button class="btn" onclick="openOrder()">＋ New Order</button><button class="btn" onclick="openProduct()">＋ Add Product</button><button class="btn" onclick="setPage('View Page')">↗ View Website</button><button class="btn" onclick="exportCSV()">⇩ Export CSV</button></div><h3 class="sectiontitle" style="margin-top:24px">Low Stock Alert</h3>${db.products.filter(p=>p.stock<=5).map(p=>`<p class="muted small">⚠ ${esc(p.name)} <b style="color:var(--yellow)">${p.stock} left</b></p>`).join('')||'<p class="muted small">All products have healthy stock.</p>'}</div></div>`}
const statuses=['Pending','RTS','Shipped','Delivered','Pending Return','Returned','Partial','Cancelled','Pending Cancel','Preorder','Lost','Confirmed','Processing','Exchange'];function ordersPage(){let rows=db.orders.filter(o=>(statusFilter==='All'||o.status===statusFilter)&&[o.id,o.customer,o.phone,o.product,o.address,o.status].join(' ').toLowerCase().includes(query.toLowerCase()));return `<div class="pagehead"><div><h1>${esc(page)}</h1><div class="muted">View, filter, update and export orders</div></div><div class="btnrow"><button class="btn" onclick="exportCSV()">⇩ Export CSV</button><button class="btn primary" onclick="openOrder()">＋ New Order</button></div></div><div class="statusbar">${['All','Pending','RTS','Shipped','Delivered','Pending Return','Returned','Partial','Cancelled','Pending Cancel','Preorder','Lost','Confirmed','Processing','Exchange'].map(s=>`<button class="statusbtn ${statusFilter===s?'active':''}" onclick="statusFilter='${s}';render()">${s}<b>${s==='All'?db.orders.length:db.orders.filter(o=>o.status===s).length}</b></button>`).join('')}</div><div class="tabs"><button class="tab active" onclick="toast('Pathao courier filter selected')">pathao <b>${db.orders.length}</b></button><button class="tab" onclick="toast('Rasel filter selected')">Rasel <b>0</b></button><button class="tab" onclick="toast('Walk-in filter selected')">Walk-in <b>0</b></button><button class="tab" onclick="toast('Showroom filter selected')">Showroom <b>0</b></button></div><div class="toolbar"><input class="searchbox" placeholder="Filter orders..." value="${esc(query)}" oninput="query=this.value;const y=window.scrollY;render();window.scrollTo(0,y)"><button class="btn" onclick="filterDialog()">▽ Filters</button><select class="btn" onchange="sortOrders(this.value)" aria-label="Sort orders"><option value="new">Date Created (Newest)</option><option value="old">Date Created (Oldest)</option><option value="high">Total (High to Low)</option></select><button class="btn" onclick="bulkAction()">⋮ Actions</button><span style="flex:1"></span><button class="btn" onclick="toggleTableView()">☷ View</button><button class="btn" onclick="toast('Table settings opened')">⚙</button></div>${ordersTable(rows,true)}`}
function ordersTable(rows,actions){if(!rows.length)return '<div class="empty">No orders found. Try another filter or create a new order.</div>';return `<div class="tablewrap"><table><thead><tr><th><input class="check" type="checkbox" onchange="document.querySelectorAll('.rowcheck').forEach(c=>c.checked=this.checked)"></th><th>Date</th><th>Invoice</th><th>Customer</th><th>Repeat Order</th><th>Note</th><th>Products</th><th>Qty</th><th>Tags</th><th>Status</th><th>Print</th><th>Total</th><th>Source</th><th>Shipping Note</th><th>Actions</th></tr></thead><tbody>${rows.map(o=>`<tr><td><input class="check rowcheck" type="checkbox" value="${esc(o.id)}"></td><td>${new Date(o.date).toLocaleDateString()}<br><span class="muted">${new Date(o.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></td><td><b>${esc(o.id)}</b></td><td><b>${esc(o.customer)}</b><br><span class="muted">${esc(o.phone)}</span><br><span class="muted">${esc(o.address)}</span></td><td>—</td><td>${esc(o.note||'—')}</td><td>${esc(o.product)}${o.size?`<br><span class="muted">Size ${esc(o.size)}</span>`:''}</td><td>${o.qty}</td><td>—</td><td><select style="background:#211a2a;color:#fff;border:1px solid #45334f;border-radius:6px;padding:5px" onchange="updateStatus('${o.id}',this.value)">${statuses.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn" style="padding:5px 7px" onclick="printOrder('${o.id}')">✓</button></td><td><b>${money(o.total)}</b></td><td>${esc(o.source||'Manual')}</td><td>${esc(o.shippingNote||'—')}</td><td><button class="btn" style="padding:5px 8px" onclick="actionMenu('${o.id}')">⋮</button></td></tr>`).join('')}</tbody></table></div>`}
function inventoryPage(){let low=page==='Low Stock Alert';let rows=db.products.filter(p=>page!=='Low Stock Alert'||p.stock<=5);return `<div class="pagehead"><div><h1>${esc(page)}</h1><div class="muted">Manage product pricing, sizes, offers and stock</div></div><div class="btnrow"><button class="btn" onclick="exportProducts()">⇩ Export CSV</button><button class="btn primary" onclick="openProduct()">＋ Add Product</button></div></div>${page==='Inventory Dashboard'?`<div class="grid stats"><div class="stat"><div class="label">Total Products</div><div class="value">${db.products.length}</div></div><div class="stat"><div class="label">Total Stock</div><div class="value">${db.products.reduce((s,p)=>s+p.stock,0)}</div></div><div class="stat"><div class="label">Low Stock</div><div class="value">${db.products.filter(p=>p.stock<=5).length}</div></div><div class="stat"><div class="label">Hidden Products</div><div class="value">${db.products.filter(p=>!p.active).length}</div></div></div>`:''}<div class="card"><div class="toolbar"><input class="searchbox" id="productSearch" placeholder="Search products..." oninput="productFilter(this.value)"><span class="muted small">${rows.length} products</span></div><div class="tablewrap"><table id="productsTable"><thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Price</th><th>Old Price</th><th>Sizes</th><th>Stock</th><th>Website</th><th>Actions</th></tr></thead><tbody>${rows.map(p=>`<tr data-search="${esc((p.name+' '+p.category).toLowerCase())}"><td>${p.id}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td>${money(p.oldPrice)}</td><td>${esc(p.size)}</td><td><span class="pill ${p.stock<=5?'yellow':'green'}">${p.stock}</span></td><td><button class="btn" style="padding:5px 8px" onclick="toggleProduct(${p.id})">${p.active?'Visible':'Hidden'}</button></td><td><button class="btn" style="padding:5px 8px" onclick="editProduct(${p.id})">Edit</button> <button class="btn danger" style="padding:5px 8px" onclick="deleteProduct(${p.id})">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}
function settingsPage(){return `<div class="pagehead"><div><h1>${esc(page)}</h1><div class="muted">Store configuration · saved in this browser</div></div><button class="btn primary" onclick="saveSettings()">Save Settings</button></div><div class="grid two"><div class="card"><h3 class="sectiontitle">Website Settings</h3><div class="formgrid"><div class="field"><label>Brand Name</label><input id="setBrand" value="${esc(db.settings.brand)}"></div><div class="field"><label>WhatsApp / Phone</label><input id="setPhone" value="${esc(db.settings.phone)}"></div><div class="field"><label>Primary Color</label><input id="setColor" type="color" value="${esc(db.settings.primary)}"></div><div class="field span3"><label>Announcement</label><input id="setAnnouncement" value="${esc(db.settings.announcement)}"></div></div></div><div class="card"><h3 class="sectiontitle">Delivery Settings</h3><div class="formgrid"><div class="field"><label>Inside Dhaka (৳)</label><input id="setInside" type="number" value="${db.settings.inside}"></div><div class="field"><label>Outside Dhaka (৳)</label><input id="setOutside" type="number" value="${db.settings.outside}"></div></div><p class="muted small">Payment settings and real courier APIs need a server/backend and provider credentials. This demo stores only browser-local settings.</p><button class="btn" onclick="setPage('View Page')">↗ Preview Website</button></div><div class="card"><h3 class="sectiontitle">Data Tools</h3><div class="btnrow"><button class="btn" onclick="exportCSV()">Export Orders CSV</button><button class="btn" onclick="exportProducts()">Export Products CSV</button><button class="btn danger" onclick="resetDemo()">Reset Demo Data</button></div></div><div class="card"><h3 class="sectiontitle">Admin Session</h3><p class="muted small">This standalone HTML is a local demo, not secure user authentication.</p><button class="btn" onclick="toast('Demo logout: no server session is active')">Logout</button></div></div>`}
function simplePage(title,desc,actions){return `<div class="pagehead"><div><h1>${esc(title)}</h1><div class="muted">${esc(desc)}</div></div></div><div class="card"><h3 class="sectiontitle">${esc(title)} Workspace</h3><p class="muted">This screen is connected to the demo interface. Use the actions below to continue.</p><div class="btnrow">${actions.map((a,i)=>`<button class="btn ${i===0?'primary':''}" onclick="runSimpleAction('${esc(a[0])}')">${esc(a[0])}</button>`).join('')}</div></div>`}
function openOrder(id=null){const o=id?db.orders.find(x=>x.id===id):null;document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><div><h2>${o?'Edit Order':'Create New Order'}</h2><div class="muted small">Customer details, product and delivery information</div></div><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveOrder(event,'${o?o.id:''}')"><div class="formgrid"><div class="field"><label>Mobile Number *</label><input name="phone" required value="${esc(o?.phone||'')}"></div><div class="field"><label>Customer Name *</label><input name="customer" required value="${esc(o?.customer||'')}"></div><div class="field"><label>Email (Optional)</label><input name="email" type="email" value="${esc(o?.email||'')}"></div><div class="field span2"><label>Address *</label><textarea name="address" required>${esc(o?.address||'')}</textarea></div><div class="field"><label>Delivery Area</label><select name="area" id="orderArea" onchange="updateDelivery()"><option value="inside">Inside Dhaka</option><option value="outside">Outside Dhaka</option></select></div><div class="field"><label>Product *</label><select name="productId" id="orderProduct" onchange="updateOrderPrice()" required>${db.products.map(p=>`<option value="${p.id}" ${o&&o.product===p.name?'selected':''}>${esc(p.name)} — ${money(p.price)}</option>`).join('')}</select></div><div class="field"><label>Size</label><input name="size" value="${esc(o?.size||'') }" placeholder="36, 38, M, L..."></div><div class="field"><label>Quantity</label><input name="qty" id="orderQty" type="number" min="1" value="${o?.qty||1}" oninput="updateOrderPrice()" required></div><div class="field"><label>Discount (৳)</label><input name="discount" id="orderDiscount" type="number" min="0" value="${o?.discount||0}" oninput="updateOrderPrice()"></div><div class="field"><label>Advance (৳)</label><input name="advance" type="number" min="0" value="${o?.advance||0}"></div><div class="field"><label>Payment Method</label><select name="payment"><option>Cash on Delivery</option><option>bKash</option><option>Nagad</option><option>Rocket</option><option>Bank Transfer</option><option>Card</option></select></div><div class="field"><label>Order Source</label><select name="source"><option>${esc(o?.source||'Manual')}</option><option>Website</option><option>Facebook</option><option>Instagram</option><option>Walk-in</option><option>Showroom</option></select></div><div class="field"><label>Status</label><select name="status">${statuses.map(s=>`<option ${o?.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field span3"><label>Order Note</label><textarea name="note">${esc(o?.note||'')}</textarea></div><div class="card span3" style="padding:13px"><div class="grid" style="grid-template-columns:repeat(4,1fr)"><div><span class="muted small">Subtotal</span><h3 id="priceSubtotal">—</h3></div><div><span class="muted small">Delivery</span><h3 id="priceDelivery">—</h3></div><div><span class="muted small">Grand Total</span><h3 id="priceTotal">—</h3></div><div><span class="muted small">Due Amount</span><h3 id="priceDue">—</h3></div></div></div><div class="btnrow span3" style="justify-content:flex-end"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">${o?'Save Changes':'Create Order'}</button></div></div></form></div></div>`;if(o)document.getElementById('orderArea').value=o.delivery===db.settings.inside?'inside':'outside';updateOrderPrice()}
function updateDelivery(){updateOrderPrice()}function updateOrderPrice(){let form=document.querySelector('#overlay form');if(!form)return;let p=db.products.find(p=>p.id==form.productId.value)||db.products[0];let qty=+form.qty.value||1,discount=+form.discount.value||0,delivery=form.area.value==='inside'?+db.settings.inside:+db.settings.outside,subtotal=Math.max(0,(p?.price||0)*qty-discount),total=subtotal+delivery,due=Math.max(0,total-(+form.advance?.value||0));document.getElementById('priceSubtotal').textContent=money(subtotal);document.getElementById('priceDelivery').textContent=money(delivery);document.getElementById('priceTotal').textContent=money(total);document.getElementById('priceDue').textContent=money(due)}
function saveOrder(e,id){e.preventDefault();let f=e.target,d=new FormData(f),p=db.products.find(p=>p.id==d.get('productId'))||db.products[0],qty=+d.get('qty')||1,discount=+d.get('discount')||0,delivery=d.get('area')==='inside'?+db.settings.inside:+db.settings.outside,subtotal=Math.max(0,p.price*qty-discount),total=subtotal+delivery;let o={id:id||'AV-'+(1001+Math.max(0,...db.orders.map(x=>+(x.id.match(/\d+/)?.[0]||1000)-1000))),date:id?(db.orders.find(x=>x.id===id)?.date||new Date().toISOString()):new Date().toISOString(),customer:d.get('customer'),phone:d.get('phone'),email:d.get('email'),address:d.get('address'),product:p.name,productId:p.id,qty,size:d.get('size'),subtotal,discount,delivery,total,advance:+d.get('advance')||0,due:Math.max(0,total-(+d.get('advance')||0)),payment:d.get('payment'),source:d.get('source'),status:d.get('status'),note:d.get('note')};if(id){db.orders=db.orders.map(x=>x.id===id?o:x)}else db.orders.unshift(o);p.stock=Math.max(0,p.stock-qty);save();closeModal();render();toast(id?'Order updated':'Order created successfully')}
function closeModal(){document.getElementById('overlay').innerHTML=''}function actionMenu(id){let o=db.orders.find(x=>x.id===id);document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" style="width:min(420px,100%)"><div class="modalhead"><div><h2>${esc(id)}</h2><div class="muted small">${esc(o.customer)} · ${money(o.total)}</div></div><button class="close" onclick="closeModal()">✕</button></div><div class="grid">${[['Order Details',()=>showDetails(id)],['Print',()=>printOrder(id)],['JPG Export',()=>toast('JPG export requires a screenshot or image library; use Print for now')],['Edit',()=>openOrder(id)],['Send to RTS',()=>updateStatus(id,'RTS')],['Cancel',()=>updateStatus(id,'Cancelled')],['Create Task',()=>openTask(id)],['Add Note',()=>addNote(id)]].map(([t,fn])=>`<button class="btn" style="text-align:left" onclick="${fn===undefined?'':`runAction('${id}','${t}')`}">${t}</button>`).join('')}</div></div></div>`;window._actionId=id}
function runAction(id,act){closeModal();if(act==='Order Details')showDetails(id);else if(act==='Print')printOrder(id);else if(act==='Edit')openOrder(id);else if(act==='Send to RTS')updateStatus(id,'RTS');else if(act==='Cancel')updateStatus(id,'Cancelled');else if(act==='Create Task')openTask(id);else if(act==='Add Note')addNote(id);else if(act==='JPG Export')toast('Use Print to save or print order details')}
function showDetails(id){let o=db.orders.find(x=>x.id===id);document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>Order Details — ${esc(id)}</h2><button class="close" onclick="closeModal()">✕</button></div><div class="grid" style="grid-template-columns:1fr 1fr">${Object.entries({Customer:o.customer,Phone:o.phone,Address:o.address,Product:o.product,Size:o.size,Quantity:o.qty,Subtotal:money(o.subtotal),Delivery:money(o.delivery),Total:money(o.total),Status:o.status,Source:o.source,Note:o.note||'—'}).map(([k,v])=>`<div class="card"><div class="muted small">${k}</div><b>${esc(v)}</b></div>`).join('')}</div><div class="btnrow" style="margin-top:15px"><button class="btn" onclick="printOrder('${id}')">Print</button><button class="btn primary" onclick="openOrder('${id}')">Edit Order</button></div></div></div>`}
function updateStatus(id,s){let o=db.orders.find(x=>x.id===id);if(o){o.status=s;save();closeModal();render();toast(`${id} status changed to ${s}`)}}function printOrder(id){let o=db.orders.find(x=>x.id===id);let w=window.open('','_blank','width=700,height=700');if(!w){toast('Please allow pop-ups to print');return}w.document.write(`<html><title>${id}</title><body style="font:16px Arial;padding:30px"><h1>${esc(db.settings.brand)} — Order Invoice</h1><hr><h2>${esc(id)}</h2><p>Date: ${new Date(o.date).toLocaleString()}</p><p>Customer: ${esc(o.customer)} | ${esc(o.phone)}</p><p>Address: ${esc(o.address)}</p><p>Product: ${esc(o.product)} | Qty: ${o.qty} | Size: ${esc(o.size||'—')}</p><p>Subtotal: ${money(o.subtotal)}</p><p>Delivery: ${money(o.delivery)}</p><h2>Total: ${money(o.total)}</h2><p>Status: ${esc(o.status)}</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function addNote(id){let o=db.orders.find(x=>x.id===id),note=prompt('Add order note:',o.note||'');if(note!==null){o.note=note;save();render();toast('Note saved')}}function openTask(id=''){let title=prompt('Task title:',id?`Follow up ${id}`:'New follow-up task');if(title){let tasks=JSON.parse(localStorage.getItem('alvina_tasks')||'[]');tasks.unshift({title,order:id,date:new Date().toISOString(),done:false});localStorage.setItem('alvina_tasks',JSON.stringify(tasks));toast('Task created')}}function filterDialog(){let s=prompt('Filter by customer, phone, product, address or status:',query);if(s!==null){query=s;render()}}function bulkAction(){let ids=[...document.querySelectorAll('.rowcheck:checked')].map(x=>x.value);if(!ids.length){toast('Select at least one order first');return}let s=prompt('Enter status for selected orders: '+statuses.join(', '),'Confirmed');if(s&&statuses.includes(s)){db.orders.forEach(o=>{if(ids.includes(o.id))o.status=s});save();render();toast(ids.length+' orders updated')}}function sortOrders(s){if(s==='old')db.orders.sort((a,b)=>new Date(a.date)-new Date(b.date));else if(s==='high')db.orders.sort((a,b)=>b.total-a.total);else db.orders.sort((a,b)=>new Date(b.date)-new Date(a.date));render()}function toggleTableView(){document.querySelector('.tablewrap')?.classList.toggle('compact');toast('View layout toggled')}
function openProduct(id=null){let p=id?db.products.find(x=>x.id===id):null;document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" style="width:min(650px,100%)"><div class="modalhead"><h2>${p?'Edit Product':'Add Product'}</h2><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveProduct(event,'${p?p.id:''}')"><div class="formgrid"><div class="field span2"><label>Product Name *</label><input name="name" required value="${esc(p?.name||'')}"></div><div class="field"><label>Category</label><input name="category" value="${esc(p?.category||'Women Wear')}"></div><div class="field"><label>Price (৳) *</label><input name="price" type="number" min="0" required value="${p?.price||''}"></div><div class="field"><label>Old Price (৳)</label><input name="oldPrice" type="number" min="0" value="${p?.oldPrice||''}"></div><div class="field"><label>Stock</label><input name="stock" type="number" min="0" value="${p?.stock??0}"></div><div class="field span2"><label>Sizes</label><input name="size" value="${esc(p?.size||'36,38,40,42,44,46,48,50,52,54,56')}"></div><div class="field"><label>Show on website</label><select name="active"><option value="true" ${p?.active!==false?'selected':''}>Visible</option><option value="false" ${p?.active===false?'selected':''}>Hidden</option></select></div><div class="btnrow span3" style="justify-content:flex-end"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Save Product</button></div></div></form></div></div>`}
function saveProduct(e,id){e.preventDefault();let d=new FormData(e.target),p={id:id?+id:Math.max(0,...db.products.map(x=>x.id))+1,name:d.get('name'),category:d.get('category'),price:+d.get('price'),oldPrice:+d.get('oldPrice')||0,stock:+d.get('stock')||0,size:d.get('size'),active:d.get('active')==='true'};if(id)db.products=db.products.map(x=>x.id===+id?p:x);else db.products.push(p);save();closeModal();render();toast(id?'Product updated':'Product added')}
function editProduct(id){openProduct(id)}function deleteProduct(id){let p=db.products.find(x=>x.id===id);if(confirm(`Delete ${p.name}?`)){db.products=db.products.filter(x=>x.id!==id);save();render();toast('Product deleted')}}function toggleProduct(id){let p=db.products.find(x=>x.id===id);p.active=!p.active;save();render();toast(p.active?'Product visible on website':'Product hidden from website')}function productFilter(q){document.querySelectorAll('#productsTable tbody tr').forEach(r=>r.style.display=r.dataset.search.includes(q.toLowerCase())?'':'none')}
function saveSettings(){db.settings.brand=document.getElementById('setBrand').value||'ALVINA';db.settings.phone=document.getElementById('setPhone').value;db.settings.primary=document.getElementById('setColor').value;db.settings.announcement=document.getElementById('setAnnouncement').value;db.settings.inside=+document.getElementById('setInside').value||80;db.settings.outside=+document.getElementById('setOutside').value||150;document.documentElement.style.setProperty('--purple',db.settings.primary);save();render();toast('Settings saved')}
function csvDownload(name,rows){let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download=name;a.click();URL.revokeObjectURL(a.href);toast('CSV exported')}
function exportCSV(){csvDownload('alvina-orders.csv',[['Order ID','Date','Customer','Phone','Address','Product','Size','Qty','Subtotal','Delivery','Total','Status','Source','Note'],...db.orders.map(o=>[o.id,o.date,o.customer,o.phone,o.address,o.product,o.size,o.qty,o.subtotal,o.delivery,o.total,o.status,o.source,o.note])])}function exportProducts(){csvDownload('alvina-products.csv',[['ID','Name','Category','Price','Old Price','Sizes','Stock','Visible'],...db.products.map(p=>[p.id,p.name,p.category,p.price,p.oldPrice,p.size,p.stock,p.active])])}function exportTasks(){let tasks=JSON.parse(localStorage.getItem('alvina_tasks')||'[]');csvDownload('alvina-tasks.csv',[['Task','Order','Date','Done'],...tasks.map(t=>[t.title,t.order,t.date,t.done])])}function resetDemo(){if(confirm('Reset all orders, products and settings to sample data?')){db=JSON.parse(JSON.stringify(defaults));save();render();toast('Demo data reset')}}
function renderStore(){document.getElementById('app').innerHTML=`<div class="app" style="display:block"><header class="topbar"><button class="toplink" onclick="setPage('Dashboard')">← Admin Panel</button><div class="topright" style="display:flex"><span class="muted small">Customer-facing preview</span><span class="avatar">A</span></div></header><div class="content"><div class="storehead"><div class="brand" style="padding:0"><span class="brandmark">A</span>${esc(db.settings.brand)}</div><div class="btnrow"><a class="toplink" href="#storeproducts">Collections</a><a class="toplink" href="#storecontact">Contact</a><button class="btn primary" onclick="document.getElementById('storeproducts').scrollIntoView({behavior:'smooth'})">Shop Now</button></div></div><section class="storehero"><span class="pill">NEW COLLECTION</span><h2>Style that feels like you.</h2><p class="muted">${esc(db.settings.announcement)}</p><button class="btn primary" onclick="document.getElementById('storeproducts').scrollIntoView({behavior:'smooth'})">Explore Collection →</button></section><div class="pagehead" id="storeproducts"><div><h1>Our Collection</h1><div class="muted">Find your next favorite look.</div></div><span class="pill">${db.products.filter(p=>p.active).length} Products</span></div><div class="grid storegrid">${db.products.filter(p=>p.active).map(p=>`<article class="storeproduct"><div class="storeimage">👗</div><div class="body"><h3>${esc(p.name)}</h3><div class="muted small">Sizes: ${esc(p.size)}</div><div class="price">${money(p.price)} ${p.oldPrice?`<del class="muted small">${money(p.oldPrice)}</del>`:''}</div><button class="btn primary" style="width:100%" onclick="storeOrder(${p.id})">Order Now</button></div></article>`).join('')||'<div class="empty">No visible products yet.</div>'}</div><div class="card" id="storecontact" style="margin-top:22px"><h3>Join our new collection list</h3><p class="muted">Call / WhatsApp: ${esc(db.settings.phone)}</p><form class="formgrid" onsubmit="subscribe(event)"><div class="field"><label>Email</label><input type="email" name="email" placeholder="you@example.com"></div><div class="field"><label>Mobile Number</label><input name="phone" placeholder="01XXXXXXXXX"></div><div style="align-self:end"><button class="btn primary">Subscribe</button></div></form></div><div class="footer">© ${new Date().getFullYear()} ${esc(db.settings.brand)} · All rights reserved</div></div></div>`}
function storeOrder(id){let p=db.products.find(x=>x.id===id);document.getElementById('overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" style="width:min(550px,100%)"><div class="modalhead"><h2>Order ${esc(p.name)}</h2><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveStoreOrder(event,${id})"><div class="formgrid"><div class="field span2"><label>Your Name *</label><input name="customer" required></div><div class="field"><label>Mobile Number *</label><input name="phone" required></div><div class="field span3"><label>Delivery Address *</label><textarea name="address" required></textarea></div><div class="field"><label>Size</label><select name="size">${p.size.split(',').map(s=>`<option>${esc(s.trim())}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input name="qty" type="number" min="1" value="1" required></div><div class="field"><label>Delivery Area</label><select name="area"><option value="inside">Inside Dhaka</option><option value="outside">Outside Dhaka</option></select></div><div class="span3"><button class="btn primary" style="width:100%">Place Order</button></div></div></form></div></div>`}
function saveStoreOrder(e,id){e.preventDefault();let d=new FormData(e.target),p=db.products.find(x=>x.id===id),qty=+d.get('qty'),delivery=d.get('area')==='inside'?+db.settings.inside:+db.settings.outside,total=p.price*qty+delivery;db.orders.unshift({id:'AV-'+(1001+Math.max(0,...db.orders.map(x=>+(x.id.match(/\d+/)?.[0]||1000)-1000))),date:new Date().toISOString(),customer:d.get('customer'),phone:d.get('phone'),address:d.get('address'),product:p.name,productId:p.id,qty,size:d.get('size'),subtotal:p.price*qty,delivery,total,status:'Pending',source:'Website',note:''});p.stock=Math.max(0,p.stock-qty);save();closeModal();renderStore();toast('Order received! Admin Order List-এ দেখা যাবে।');let msg=`Assalamu Alaikum, ${db.settings.brand} এ অর্ডার করেছি.%0AName: ${encodeURIComponent(d.get('customer'))}%0APhone: ${encodeURIComponent(d.get('phone'))}%0AProduct: ${encodeURIComponent(p.name)}%0ASize: ${encodeURIComponent(d.get('size'))}%0AQty: ${qty}%0ATotal: ${total}`;setTimeout(()=>{if(confirm('WhatsApp-এ অর্ডারের বিস্তারিত পাঠাতে চান?'))window.open('https://wa.me/88'+db.settings.phone.replace(/\D/g,'')+'?text='+msg,'_blank')},200)}function subscribe(e){e.preventDefault();let d=new FormData(e.target);let subs=JSON.parse(localStorage.getItem('alvina_subscribers')||'[]');subs.push({email:d.get('email'),phone:d.get('phone'),date:new Date().toISOString()});localStorage.setItem('alvina_subscribers',JSON.stringify(subs));e.target.reset();toast('Thank you for subscribing!')}
function runSimpleAction(label){if(label.includes('Order'))openOrder();else if(label.includes('Website'))setPage('View Page');else if(label.includes('Export'))exportCSV();else if(label.includes('Task'))openTask();else toast(label+' opened')}
function runActionDummy(){}render();
</script></body></html>
